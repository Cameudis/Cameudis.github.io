name: Build

on:
  push:
    branches: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build into an isolated destination
        run: bundle exec jekyll build --destination _site
      - name: Reject recursive build output
        run: test ! -e _site/docs
      - name: Verify committed deployment output
        run: |
          bundle exec jekyll build
          git diff --exit-code -- docs
