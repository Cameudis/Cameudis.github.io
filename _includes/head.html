<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/images/favicon.ico' | relative_url }}">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('user-color-scheme');
      var validThemes = ['dark', 'light', 'blue-white'];
      var theme = validThemes.indexOf(savedTheme) !== -1
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  {%- seo -%}
  {%- assign main_css_version = page.asset_version | default: site.asset_versions.main_css -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}?v={{ main_css_version }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- if page.use_math -%}
  <script type="text/javascript" async
    src="{{ site.third_party.mathjax_url }}">
  </script>
  {%- endif -%}
  <script src="{{ "/assets/js/theme.js" | relative_url }}?v={{ site.asset_versions.theme }}" defer></script>
</head>
