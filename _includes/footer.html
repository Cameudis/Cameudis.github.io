<footer class="site-footer h-card">
  <data class="u-url" href="{{ " /" | relative_url }}"></data>
  <div class="wrapper">
    <div class="footer-header">
      <h2 class="footer-heading">[ {{ site.title | escape }} ]</h2>
      <p class="footer-status">STATUS: ONLINE / UPTIME: <span id="site-uptime">∞</span></p>
      <script>
        (function () {
          var start = new Date('2022-07-16T00:00:00');
          function update() {
            var now = new Date();
            var diff = now - start;
            if (diff < 0) { return; }
            var years = Math.floor(diff / 31536000000);
            var days = Math.floor((diff % 31536000000) / 86400000);
            var hours = Math.floor((diff % 86400000) / 3600000);
            var mins = Math.floor((diff % 3600000) / 60000);
            var secs = Math.floor((diff % 60000) / 1000);
            document.getElementById('site-uptime').textContent =
              years + 'y ' + days + 'd ' + hours + 'h ' + mins + 'm ' + secs + 's';
          }
          update();
          setInterval(update, 1000);
        })();
      </script>
    </div>

    <div class="footer-layout">
      <!-- Col 1: Contact -->
      <div class="footer-col">
        <div class="footer-title">CONTACT_INFO</div>
        <div class="footer-content">
          <p class="p-name">{{ site.author | escape }}</p>
          {%- if site.email -%}
          <a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
          {%- endif -%}
        </div>
      </div>

      <!-- Col 2: Social Links -->
      <div class="footer-col">
        <div class="footer-title">SOCIAL_NETWORKS</div>
        <div class="footer-content">
          {%- include social.html -%}
        </div>
      </div>

      <!-- Col 3: Visitor Map -->
      <div class="footer-col">
        <div class="footer-title">VISITOR_MAP</div>
        <div class="footer-map-mini">
          <script type="text/javascript" id="mapmyvisitors"
            src="//mapmyvisitors.com/map.js?d=VEk4VYKnI9sCCEXCgdKor_rhcYKrCEm6C9mIRceo1og&cl=ffffff&w=a"></script>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="quiet-humor">/* Free and useless. */</p>
      <div style="margin-bottom: 20px;">
        <img src="https://blog-1308958542.cos.ap-shanghai.myqcloud.com/20251230224502598.gif" alt="badge" width="88"
          height="31">
      </div>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
    </div>
  </div>
</footer>
