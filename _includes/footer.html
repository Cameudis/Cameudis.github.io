<footer class="site-footer h-card">
  <data class="u-url" href="{{ " /" | relative_url }}"></data>
  <div class="wrapper">
    <div class="footer-header">
      <h2 class="footer-heading">[ {{ site.title | escape }} ]</h2>
      <p class="footer-status">STATUS: ONLINE / UPTIME: <span id="site-uptime">∞</span></p>
    </div>

    <div class="footer-layout">
      <!-- Col 1: Contact -->
      <div class="footer-col">
        <div class="footer-title">CONTACT_INFO</div>
        <div class="footer-content">
          <p class="p-name">{{ site.author | escape }}</p>
          {%- if site.email -%}
          <a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a>
          {%- endif -%}
        </div>
      </div>

      <!-- Col 2: Social Links -->
      <div class="footer-col">
        <div class="footer-title">SOCIAL_NETWORKS</div>
        <div class="footer-content">
          {%- include social.html -%}
        </div>
      </div>

      <!-- Col 3: Visitor Map -->
      <div class="footer-col">
        <div class="footer-title">VISITOR_MAP</div>
        <div class="footer-map-mini"
          data-map-src="{{ site.third_party.visitor_map_url | escape }}"></div>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="quiet-humor">/* Free and useless. */</p>
      <div style="margin-bottom: 20px;">
        <img src="https://blog-1308958542.cos.ap-shanghai.myqcloud.com/20251230224502598.gif" alt="badge" width="88"
          height="31" loading="lazy" decoding="async">
      </div>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
    </div>
  </div>
</footer>
<script src="{{ "/assets/js/footer.js" | relative_url }}?v={{ site.asset_versions.footer }}" defer></script>
