<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-CN" }}">

{%- include head.html -%}

<body class="layout-{{ page.layout | default: 'default' }}">

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}

  {%- if content contains 'class="hover-note"' -%}
  <script src="{{ "/assets/js/hover-notes.js" | relative_url }}?v={{ site.asset_versions.hover_notes }}" defer></script>
  {%- endif -%}

  {%- if content contains 'language-mermaid' -%}
  <script type="module" src="{{ "/assets/js/mermaid-loader.js" | relative_url }}?v={{ site.asset_versions.mermaid }}"></script>
  {%- endif -%}

</body>

</html>
