# Site settings
title: Y²的博客
author: Y² (aka.cameudis)
email: cameudis@gmail.com
description: >-  # this means to ignore newlines until "baseurl:"
  计算机、安全和其他
baseurl: ""  # the subpath of your site, e.g. /blog
url: "https://www.cameudis.com"  # the base hostname & protocol for your site
twitter_username: cameudis
github_username:  cameudis

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Bump when changing a cacheable site asset referenced with this version.
asset_versions:
  footer: "20260715-3"
  main_css: "20260715-external-link-icons"
  post: "20260716-source-link-spacing"

# Build output for GitHub Pages (deployed from ./docs on the gh-pages branch)
destination: ./docs
include: ["CNAME"]

port: 4001

# Exclude non-page files from the build output (./docs).
# Jekyll 4 appends these to its internal default exclude list.
exclude:
  # Keep committed build output out of alternate/CI destinations.
  - docs
  - AGENTS.md
  - README.md
  - bin
  - package.json
  - package-lock.json

# Valine comments (LeanCloud)
valine:
  app_id: "Ji5y9HTOlb2QGDO0XFlWXNRy-gzGzoHsz"
  app_key: "6VqGye1352LX381YQDTOaiXs"
  placeholder: "El Psy Congroo"

# Version-pinned third-party browser assets.
third_party:
