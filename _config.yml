# Site settings
title: Y²的博客
author: Y² (aka.cameudis)
email: cameudis@gmail.com
description: >-  # this means to ignore newlines until "baseurl:"
  计算机、安全和其他
baseurl: ""  # the subpath of your site, e.g. /blog
url: "https://www.cameudis.com"  # the base hostname & protocol for your site
twitter_username: cameudis
github_username:  cameudis

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Build output for GitHub Pages (deployed from ./docs on the gh-pages branch)
destination: ./docs
include: ["CNAME"]

port: 4001

# Exclude non-page files from the build output (./docs).
# Jekyll 4 appends these to its internal default exclude list.
exclude:
  - AGENTS.md
  - README.md

# Algolia search (search_only_api_key is safe to expose on the client)
